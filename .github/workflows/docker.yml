# Builds the Docker image on GitHub's runners (nothing runs locally) and checks the app imports inside it,
# plus the offline self-checks. No cloud credentials are needed: these steps make no model calls.
name: docker
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t veritas:ci .
      - name: App imports and offline checks inside the image
        run: |
          docker run --rm -e GOOGLE_CLOUD_PROJECT=ci veritas:ci sh -c \
            "python -c 'import agent, ingest, eval, cache' && python test_routing.py && python test_ingest.py && python test_eval.py && python test_cache.py"
      - name: Compose file is valid
        run: touch .env && GCP_KEY_FILE=/dev/null docker compose config --quiet  # .env is never committed
